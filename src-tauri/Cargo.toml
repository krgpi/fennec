[package]
name = "fennec-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fennec_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fennec-core = { path = "../crates/fennec-core" }
fennec-audio = { path = "../crates/fennec-audio" }
fennec-stt = { path = "../crates/fennec-stt" }
chrono.workspace = true
uuid.workspace = true
trash = "5"
interprocess = "2"
hound = "3.5"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = "0.4"
ureq = "3"
ical = "0.11"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "EKEventStore",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKObject",
    "EKSource",
    "EKTypes",
    "block2",
    "objc2-core-graphics",
] }
