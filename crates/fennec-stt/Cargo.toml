[package]
name = "fennec-stt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fennec-core = { path = "../fennec-core" }
fennec-audio = { path = "../fennec-audio" }
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
whisper-rs = "0.14"
ureq = "2"
tar = "0.4"
bzip2 = "0.4"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

[target.'cfg(target_os = "macos")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }

[dev-dependencies]
tempfile = "3"
