name: Fennec
options:
  bundleIdPrefix: io.github.krgpi
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: ja

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.0.0"

targets:
  Fennec:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fennec.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.krgpi.Fennec.debug
          PRODUCT_NAME: "Fennec Dev"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.krgpi.Fennec
          PRODUCT_NAME: Fennec
    dependencies:
      - package: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
