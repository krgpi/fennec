[workspace]
resolver = "2"
members = [
    "crates/fennec-core",
    "crates/fennec-audio",
    "crates/fennec-stt",
    "crates/fennec-cli",
    "src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[patch.crates-io]
whisper-rs-sys = { path = "patches/whisper-rs-sys" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
anyhow = "1"
thiserror = "2"
