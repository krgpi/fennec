name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Fennec.xcodeproj \
            -scheme Fennec \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          APP_PATH="build/Build/Products/Release/Fennec.app"
          ditto -c -k --keepParent "$APP_PATH" Fennec.zip

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 Fennec.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            Fennec.zip \
            --title "$TAG" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          VERSION="${TAG#v}"
          gh api repos/krgpi/homebrew-tap/dispatches \
            -f event_type=update-cask \
            -f "client_payload[cask]=fennec" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[sha256]=$SHA256"
