name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fennec-core
      - run: cargo build -p fennec-core -p fennec-cli
    # Swiftヘルパー(SpeechAnalyzer)はmacOS 26 SDKが必要なためCIランナーではフルバンドルを行わない。
    # macOSのフルビルド検証はローカル(macOS 26+)で実施する

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p fennec-core
      - run: pnpm tauri build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fennec-windows-debug
          path: target/debug/bundle/nsis/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev clang cmake bzip2 \
            build-essential curl wget file libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p fennec-core -p fennec-audio
      - run: pnpm tauri build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fennec-linux-debug
          path: |
            target/debug/bundle/deb/*.deb
            target/debug/bundle/appimage/*.AppImage
          if-no-files-found: warn
