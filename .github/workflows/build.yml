name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 配布用バイナリは各OSのローカルマシンで `scripts/release.sh` を使って作るため、
# CIではフルバンドル(`tauri build`)を行わずテストとコンパイル確認のみに絞る。
# macOSはSwiftヘルパー(SpeechAnalyzer)がmacOS 26 SDKを要求しCIランナーではそもそもバンドルできない。
jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fennec-core
      - run: cargo build -p fennec-core -p fennec-cli

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fennec-core
      - run: cargo build -p fennec-core -p fennec-cli

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fennec-core -p fennec-audio
      - run: cargo build -p fennec-core -p fennec-cli
